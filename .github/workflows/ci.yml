name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Run formatting, static analysis, tests, and debug builds
        run: ./gradlew ktlintCheck detektAll lintDebug test testDebugUnitTest assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify JVM and Android unit tests executed
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          def summarize(pattern: str):
              files = sorted(glob.glob(pattern, recursive=True))
              tests = 0
              failures = 0
              errors = 0
              for path in files:
                  root = ET.parse(path).getroot()
                  tests += int(root.attrib.get("tests", 0))
                  failures += int(root.attrib.get("failures", 0))
                  errors += int(root.attrib.get("errors", 0))
              return len(files), tests, failures, errors

          jvm = summarize("**/build/test-results/test/TEST-*.xml")
          android = summarize("**/build/test-results/testDebugUnitTest/TEST-*.xml")
          print(f"JVM test suites={jvm[0]} tests={jvm[1]} failures={jvm[2]} errors={jvm[3]}")
          print(f"Android unit test suites={android[0]} tests={android[1]} failures={android[2]} errors={android[3]}")
          if jvm[1] <= 0 or android[1] <= 0 or jvm[2] or jvm[3] or android[2] or android[3]:
              sys.exit(1)
          EOF

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          if-no-files-found: ignore
