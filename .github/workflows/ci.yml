name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          if [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          fi

      - name: Run formatting, static analysis, tests, screenshot checks, and debug builds
        run: ./gradlew ktlintCheck detektAll lintDebug test testDebugUnitTest testDebugScreenshotTestDefaultTestSuite assembleDebug assembleDebugAndroidTest --stacktrace

      - name: Verify JVM, Android unit, and screenshot tests executed
        run: |
          python3 - <<'EOF'
          import glob
          import sys
          import xml.etree.ElementTree as ET

          def summarize(pattern: str):
              files = sorted(glob.glob(pattern, recursive=True))
              tests = 0
              skipped = 0
              failures = 0
              errors = 0
              for path in files:
                  root = ET.parse(path).getroot()
                  tests += int(root.attrib.get("tests", 0))
                  skipped += int(root.attrib.get("skipped", 0))
                  failures += int(root.attrib.get("failures", 0))
                  errors += int(root.attrib.get("errors", 0))
              executed = tests - skipped
              return len(files), tests, skipped, executed, failures, errors

          checks = [
              ("JVM unit tests", "**/build/test-results/test/TEST-*.xml"),
              ("Android unit tests", "**/build/test-results/testDebugUnitTest/TEST-*.xml"),
              (
                  "Screenshot tests",
                  "**/build/intermediates/debug/testDebugScreenshotTestDefaultTestSuite/results/TEST-*.xml",
              ),
          ]

          failed = False
          for label, pattern in checks:
              suites, tests, skipped, executed, failures, errors = summarize(pattern)
              print(
                  f"{label}: suites={suites} tests={tests} skipped={skipped} "
                  f"executed={executed} failures={failures} errors={errors}"
              )
              if executed <= 0 or failures > 0 or errors > 0:
                  failed = True

          if failed:
              sys.exit(1)
          EOF

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: verification-reports
          path: |
            **/build/reports/**
            **/build/test-results/**
            **/build/intermediates/debug/testDebugScreenshotTestDefaultTestSuite/**
          if-no-files-found: ignore
